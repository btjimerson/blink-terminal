name: Build and Push to GHCR

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Necessary permissions for GHCR
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  IMAGE_NAME: blink-terminal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      # Checkout the default branch (not the detached tag commit) so the
      # version-bump commit can fast-forward onto the current branch tip.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # Get the version from the tag and update package.json.
      # Sync this change back to the tag that triggered the workflow.
      - name: Update package.json Version and Sync Tag
        run: |
          # Get the tag name (removes 'refs/tags/' and the 'v' prefix if present)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
    
          echo "Updating package.json to version: $VERSION"
    
          # Use jq to update the version field in-place
          jq ".version = \"$VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json

          # Configure Git commit
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Make sure we are on the branch tip before committing
          git pull --ff-only origin ${{ github.event.repository.default_branch }}

          # Commit and push change to the branch (e.g., main).
          # Skip the commit if package.json already matches the target version.
          git add package.json
          git diff --cached --quiet || git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          
          # Force update the tag to point to this new commit
          git tag -f $GITHUB_REF_NAME
          git push origin $GITHUB_REF_NAME --force

      # Log in to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:latest
